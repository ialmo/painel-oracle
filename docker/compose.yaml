# Painel Oracle - ORDS (API REST + servidor do painel)
#
# Este arquivo sobe SÓ o ORDS e o conecta a um Oracle que JÁ ESTÁ RODANDO
# na sua máquina (container próprio, de aula, etc.). Configure qual banco
# usar no arquivo .env desta pasta (copie de .env.example).
#
#   cd docker
#   cp .env.example .env      # e ajuste os valores
#   docker compose up -d
#
# Não tem Oracle nenhum? Suba um junto com o ORDS:
#   docker compose -f compose.yaml -f compose.banco.yaml up -d
#
# Acompanhar:  docker compose logs -f ords
# Derrubar:    docker compose down        (mantém a configuração do ORDS)
#              docker compose down -v     (apaga a configuração do ORDS)

name: painel-oracle

services:
  ords:
    container_name: painel-oracle-ords
    image: container-registry.oracle.com/database/ords:latest
    ports:
      - "${ORDS_HOST_PORT:-8181}:8080"
    environment:
      # Por padrão o ORDS acessa o Oracle pela porta publicada no seu Mac/PC
      # (host.docker.internal = a máquina hospedeira, vista de dentro do container)
      DBHOST: ${DB_HOST:-host.docker.internal}
      DBPORT: ${DB_PORT:-1521}
      DBSERVICENAME: ${DB_SERVICE:-FREEPDB1}
      ORACLE_PWD: ${ORACLE_PWD:?Defina ORACLE_PWD no arquivo docker/.env}
      ORDS_PWD: ${ORDS_PWD:-OrdsPublic123}
    extra_hosts:
      # Necessário no Linux; no Docker Desktop (Mac/Windows) já existe
      - "host.docker.internal:host-gateway"
    # Na 1a subida instala o ORDS no banco (conectando como SYS) e depois
    # inicia o servidor. Nas próximas, só inicia (a configuração fica no volume).
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        CFG=/etc/ords/config
        if [ ! -f "$$CFG/databases/default/pool.xml" ]; then
          echo ">>> Instalando ORDS em $$DBHOST:$$DBPORT/$$DBSERVICENAME (leva alguns minutos)..."
          printf '%s\n%s\n' "$$ORACLE_PWD" "$$ORDS_PWD" | ords --config "$$CFG" install \
            --admin-user SYS \
            --db-hostname "$$DBHOST" \
            --db-port "$$DBPORT" \
            --db-servicename "$$DBSERVICENAME" \
            --feature-sdw true \
            --log-folder /tmp \
            --password-stdin
        fi
        # Pasta de arquivos estáticos: o painel fica em /painel/index.html
        ords --config "$$CFG" config set standalone.doc.root /opt/painel-docroot
        echo ">>> Iniciando ORDS na porta 8080"
        exec ords --config "$$CFG" serve
    volumes:
      - ords-config:/etc/ords/config
      # O próprio ORDS serve o painel (pasta web) em /painel/
      # -> http://localhost:8181/painel/index.html  (mesma origem da API, sem CORS)
      # Fica FORA de /etc/ords/config: montar algo lá dentro cria pastas como
      # root antes da instalação e o ORDS (usuário oracle) não consegue gravar.
      - ../web:/opt/painel-docroot/painel:ro

volumes:
  ords-config:
    name: painel-oracle-ords-config